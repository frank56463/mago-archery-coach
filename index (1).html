<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><meta name="apple-mobile-web-app-capable" content="yes"><title>MAGO Archery Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 40px}.tag{display:inline-block;background:#273244;border-radius:99px;padding:6px 10px;font-size:12px}h1{font-size:26px;margin:10px 0 4px}.sub,.hint{color:#9ca3af}.card{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:18px;margin:14px 0}select{width:100%;margin-top:8px;padding:13px;background:#0d1117;color:white;border:1px solid #30363d;border-radius:12px;font-size:16px}.step{font-size:13px;color:#9ca3af}.name{font-size:29px;font-weight:800;margin:13px 0 6px}.detail{min-height:44px;color:#c1c7d0}.timer{font-size:68px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin:8px 0}.progress{height:8px;background:#2b3139;border-radius:9px;overflow:hidden;margin:16px 0}.bar{height:100%;width:0;background:#e6edf3}.controls{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:9px}button{border:0;border-radius:14px;padding:15px 8px;background:#252c35;color:#fff;font-size:16px;font-weight:700}.primary{background:#f0f3f6;color:#111}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric button{width:100%;margin-top:8px}.cue{font-size:24px;font-weight:750;text-align:center;padding:8px}.hint{font-size:13px;line-height:1.5}</style></head><body><main>
<span class="tag">MAGO ARCHERY</span><h1>射箭訓練 Coach</h1><div class="sub">自動倒數・中文提示・手機訓練播放器</div>
<div class="card"><b>訓練模式</b><select id="mode"><option value="strength">今日體能｜中等強度</option><option value="warmup">射箭暖身｜約12分鐘</option><option value="shot">Shot Cycle｜60 BPM</option></select></div>
<div class="card"><div id="step" class="step"></div><div id="name" class="name"></div><div id="detail" class="detail"></div><div id="timer" class="timer">00:00</div><div class="progress"><div id="bar" class="bar"></div></div><div class="controls"><button id="prev">上一項</button><button id="play" class="primary">開始</button><button id="next">下一項</button></div></div>
<div class="card"><div class="cue">接 ・ 展 ・ 續</div></div><div class="card metrics"><div class="metric">疼痛<button id="pain">0 / 10</button></div><div class="metric">疲勞<button id="fatigue">0 / 10</button></div></div><div class="hint">疼痛明顯增加時停止該動作。實弓無箭僅可控制回弓，不可空放。紀錄只存在本機。</div>
<script>(function(){var plans={strength:[["暖身","快走／腳踏車",360,"RPE 3–4"],["活動度","胸椎旋轉＋Wall Slide",120,"各 2×8"],["主訓練","Goblet Squat",180,"3×8｜RPE 6"],["主訓練","Single-leg RDL",240,"3×8/側｜骨盆保持水平"],["主訓練","Reverse Lunge",180,"2×8/側"],["上肢","One-arm DB Row",150,"2×10/側｜Hook痛≤1/10"],["肩胛","Wall Slide",120,"2×10｜不聳肩"],["核心","Dead Bug",180,"3×8/側"],["核心","Side Plank",160,"2×30–40秒/側"],["臀中肌","Side-lying Hip Abduction",150,"2×12–15/側"],["收操","輕鬆活動＋呼吸",360,"手指手腕不做強力拉伸"]],warmup:[["升溫","快走／原地踏步",150,"逐漸升溫"],["手部","手指開合＋Hook形狀",90,"無痛範圍"],["手腕","屈伸＋旋前旋後",90,"各8–10次"],["肩胛","Wall Slide",90,"8–10次"],["肩袖","彈力帶外旋",90,"10–15次"],["模擬","輕彈力帶 Shot Cycle",120,"接、展、續"],["實弓","拉弓→靠位→安全回弓",180,"3–5次；不可空放"]],shot:[["節奏","1–4｜舉弓→靠位",4,"每秒一拍"],["接","5｜肩帶承重",1,"肩帶接住力量"],["展","6｜前後延伸",1,"前手方向穩定"],["續","7｜持續",1,"什麼都不要加"],["完成","Follow-through",3,"自然完成"]]},idx=0,left=0,total=0,running=false,tick=null,plan=plans.strength,$=function(x){return document.getElementById(x)};function say(s){try{if("speechSynthesis" in window&&"SpeechSynthesisUtterance" in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang="zh-TW";window.speechSynthesis.speak(u)}}catch(e){}}function fmt(s){var m=Math.floor(s/60),x=s%60;return("0"+m).slice(-2)+":"+("0"+x).slice(-2)}function render(reset){var x=plan[idx];if(reset){left=x[2];total=x[2]}$("step").textContent=(idx+1)+" / "+plan.length+"　"+x[0];$("name").textContent=x[1];$("detail").textContent=x[3];$("timer").textContent=fmt(left);$("bar").style.width=(total?(total-left)/total*100:0)+"%"}function go(n){idx=Math.max(0,Math.min(plan.length-1,n));render(true);say(plan[idx][1])}function stop(){running=false;clearInterval(tick);$("play").textContent="繼續"}function start(){if(running){stop();return}running=true;$("play").textContent="暫停";say(plan[idx][1]);tick=setInterval(function(){if(left>0){left--;render(false)}else if(idx<plan.length-1){go(idx+1)}else{stop();$("play").textContent="完成";say("訓練完成")}},1000)}$("play").onclick=start;$("prev").onclick=function(){go(idx-1)};$("next").onclick=function(){go(idx+1)};$("mode").onchange=function(){stop();plan=plans[this.value];idx=0;render(true)};function metric(id,key){var v=parseInt(localStorage.getItem(key)||"0",10);$(id).textContent=v+" / 10";$(id).onclick=function(){v=(v+1)%11;localStorage.setItem(key,String(v));this.textContent=v+" / 10"}}metric("pain","magoPain");metric("fatigue","magoFatigue");render(true)})();</script></main></body></html>
